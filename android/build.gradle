// Fix for Android Studio not finding node (nvm / PATH issues)
System.setProperty("node.binary", project.findProperty("NODE_BINARY") ?: "/usr/local/bin/node")

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// RNGH resolves react-native via `node` unless this is set; Gradle from Android Studio often lacks nvm/PATH.
ext {
    REACT_NATIVE_NODE_MODULES_DIR = file("${rootDir}/../node_modules/react-native").absolutePath
}

apply plugin: "com.facebook.react.rootproject"